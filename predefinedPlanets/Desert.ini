atmosphereDensity=1
;innerCoreType: Describes the content of the inner-most sphere of the planet.
;Use 'Clear' to make the inner core hollow.
;Depending on this setting, certain (or all) vehicles will be unable to stand
;on the bottom layer.
;Lava is always nice.
;Written to savegames and restored from there, but cannot be altered once a
;game has started.
;Content; range=Unknown, Granite, Earth, Grass, Rock, Sand, Snow, Foundation,
;Road, Lava, Technite, Water, Clear; default=Lava.
innerCoreType=Granite
;Describes the first layer of matter around the core. This layer will replace
;any matter formed by [Mountains]
[ExtendedCore]
	;type: Terrain content to fill the extended core with.
	;The extended core reaches from the bottom most layer up to a height level
	;corresponding to the remaining configuration of [ExtendedCore].
	;The core itself it not altered by these settings.
	;Common scenarios include Lava or something hard like Granite.
	;Less common, but sometimes nice is to set this to 'Clear', which will carve
	;caves atop the inner core.
	;Written to savegames and restored from there, but cannot be altered once a
	;game has started.
	;Content; range=Unknown, Granite, Earth, Grass, Rock, Sand, Snow, Foundation,
	;Road, Lava, Technite, Water, Clear; default=Unknown.
	type=Rock
	;baseHeight: Central height of extended core matter.
	;The terrain content specified in [type] will replace matter up to
	;height=baseHeight+[random value]*noiseHeightScale, so chosing a low value
	;might be a good idea.
	;Written to savegames and restored from there, but cannot be altered once a
	;game has started.
	;Int32; range=[-16,15]; default=-16.
	baseHeight=-16
	;noiseHeightScale: Vertical noise stretching. Non-negative floating point.
	;0.0 will create a perfectly flat sphere at height baseHeight.
	;1 will be fairly mountainous, more is usually overkill.
	;Written to savegames and restored from there, but cannot be altered once a
	;game has started.
	;Float32; range=[0,10]; default=1.
	noiseHeightScale=1
	;frequency: Frequency of noise evolution. The higher, the thinner, sharper and
	;more frequent mountains occur.
	;Doesn't affect their height but will create a lot of pointy needles if too
	;high.
	;Lower values can be used to relax the terrain
	;Written to savegames and restored from there, but cannot be altered once a
	;game has started.
	;Float32; range=[0,10]; default=1.
	frequency=1
	;dampening: Height levels above and below zero that are collapsed to zero to
	;create an overall flatter terrain.
	;E.g. if this is set to 2 then any resulting random height-level ([random
	;value]*noiseHeightScale) that is -2,-1,0,1, or 2 will be interpreted as 0.
	;Using any non-zero setting will result in flat valleys near the median height
	;(baseHeight).
	;Written to savegames and restored from there, but cannot be altered once a
	;game has started.
	;Int32; range=[0,10]; default=0.
	dampening=0
[Mountains]
	;top: Content of the top-most surface cell (except where intersected by
	;[ExtendedCore], or covered by [Liquid]).
	;Depending on height and settings this value may selectively be replaced by
	;'Snow', or Liquid.outline where appropriate.
	;If type is set to 'Unknown' it can also be replaced by 'Rock', if above
	;height level 2.
	;Written to savegames and restored from there, but cannot be altered once a
	;game has started.
	;Content; range=Unknown, Granite, Earth, Grass, Rock, Sand, Snow, Foundation,
	;Road, Lava, Technite, Water, Clear; default=Grass.
	top=Grass
	;type: Type to fill mountains with.
	;'Unknown' attempts to guess what is best and may also selectively replace top
	;under certain circumstances.
	;Using 'Unknown' will chose mostly 'Rock'. 'Earth' is chosen only if
	;appropriate by height, and top is set to
	;'Earth', 'Grass', 'Sand', or 'Snow'
	;Written to savegames and restored from there, but cannot be altered once a
	;game has started.
	;Content; range=Unknown, Granite, Earth, Grass, Rock, Sand, Snow, Foundation,
	;Road, Lava, Technite, Water, Clear; default=Unknown.
	type=Unknown
