[runtime]
	;capFPS: set to some non-negative number to hard-cap the fps to that number 
	;(is probably slightly less on average)
	capFPS						=	-1
	;vsync: set 1 to enable vertical sync, 0 disables it
	vsync						=	1
	;fsaa: number of samples to use for fullscene antialiasing. 0 disables fsaa. 4 
	;is good, more is usually overkill.
	fsaa						=	4
	;alwaysDay: sun will be positioned such that the currently viewed planet side 
	;is always day-lit
	alwaysDay					=	true
	;resourcesAsList: hides resource bars. shows icons and numbers in the form of 
	;a list instead
	resourcesAsList				=	true
	;soundEnabled: global sound enable-switch. true by default. Set false to 
	;disable all sound output
	soundEnabled				=	true
	;soundVolume: global sound volume. 1 by default. Set to higher values to 
	;increase the level of all sounds
	soundVolume					=	1
	;shadowQuality: Runtime shadow quality. Supported values are: Filtered6x6 
	;Filtered3x3 Unfiltered Off
	shadowQuality				=	"Filtered3x3"
	;alwaysQueueUnitCommands: If set true, new unit commands are automatically 
	;appended to the end of a unit's command queue. If set false, the command queue 
	;of the active unit is flushed prior to issuing a new command UNLESS shift is 
	;pressed.
	alwaysQueueUnitCommands		=	false
	;uiScale: Scales font and component sizes (including hex-buttons). Default is 
	;1 (original).
	uiScale						=	1
	;musicVolume: Loudness of music playback
	musicVolume					=	0.5
	;maxExplosionParticles: Number of particles simultaneously allowed during 
	;rendering. If explosions tend to slow down your system, reduce number.
	maxExplosionParticles		=	2000
	;musicDuringGameplay: Enable music during regular game play.
	;Warning: Setting this may end up making the currently only music track 
	;sound very dull very quickly.
	musicDuringGameplay			=	false
	;terrainCameraIntersectionCorrection: Enable to keep camera from intersecting with the terrain.
	;This is still experimental so it's current form might be too expensive on
	;lower-end CPUs. Disabling this may improve performance
	terrainCameraIntersectionCorrection		=	true
[timelapse]
	;outDirectory: Root directory to put time lapse sequences into. Set empty or 
	;remove to use My Documents/My Games/Hexaverse/client/player/timelapses
	outDirectory				=	""
	;frameDelaySeconds: Seconds between timelapse screenshots during animation phase
	frameDelaySeconds			=	0.2
	;maxCompressionPNG: Set true to use maximum (slow) PNG compression when saving 
	;time lapse screenshots. Observe queue of remaining screenshots to see if this 
	;is a good idea
	maxCompressionPNG			=	false
