[runtime]
	capFPS = -1	//set to some non-negative number to hard-cap the fps to that number (is probably slightly less on average)
	vsync = 1	//set 1 to enable vertical sync, 0 disables it
	fsaa = 4	//number of samples to use for fullscene antialiasing. 0 disables fsaa. 4 is good, more is usually overkill.
	alwaysDay = true	//sun will be positioned such that the currently viewed planet side is always day-lit
	resourcesAsList = true	//hides resource bars. shows icons and numbers in the form of a list instead
	soundEnabled = true	//global sound enable-switch. true by default. Set false to disable all sound output
	soundVolume = 1.0	//global sound volume. 1 by default. Set to higher values to increase the level of all sounds

[timelapse]
	;outDirectory: Root directory to put time lapse sequences into. Set empty or remove to use My Documents/My Games/Hexaverse/client/player/timelapses
	outDirectory = ""
	;frameDelaySeconds: Seconds between timelapse screenshots during animation phase
	frameDelaySeconds = 0.2
	;maxCompressionPNG: Set true to use maximum (slow) PNG compression when saving time lapse screenshots. Observe queue of remaining screenshots to see if this is a good idea
	maxCompressionPNG = false


[technites]
	;autoStartClientPath: Path to the client executable to automatically launch. Effective only if autoStartClient is true
	autoStartClientPath = "./TechniteLogic/Client"
	;autoStartClient: Set to true to automatically start technite logic client when needed
	autoStartClient = false
	;fixedServerPort: Set true to always use the same port for the technite logic server (hosted by the game client). Set to false to automatically determine a free port number.
	;Binding a fixed port does not allow to run more than one game client on the same machine
	fixedServerPort = true
	;fixedServerPortNumber: Port number to use if fixedServerPort is set true. Automatically determined otherwise
	fixedServerPortNumber = 30000
	