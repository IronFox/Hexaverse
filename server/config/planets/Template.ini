description='Your planet'

;This type is meant as a template for other/new planet types and features the full documentation.
;Other ini files will be reduced to plain data. It is generally not recommended to alter any of the existing planet definitions

;visible atmosphere density. floating point 0 (none visible) to 1 (very dense)
atmosphereDensity = 0.5
;innerCoreType: Describes the content of the inner-most sphere of the planet.
;valid type name are: Granite,Earth,Grass,Rock,Sand,Snow,Foundation,Road,Lava,Water,Clear
;use 'Clear' to make the inner core hollow. Vehicles/buildings will not be able to stand on the bottom layer if this is set true.
;Lava is always nice
innerCoreType = 'Lava'

;ExtendedCore: Describes the first layer of matter around the core. This layer will replace any matter formed by [Mountains]
;Common scenarios are to set this to Lava or something hard like Granite. Less common, but sometimes nice is Clear,
;which will carve caves atop the inner core
[ExtendedCore]
	;<type>: Describes the content to fill the extended core with.
	;Up to the height level determined by the values below this content will replace anything from the core up to the determined height
	;The core itself it not altered by these settings
	;Valid are: Granite,Earth,Grass,Rock,Sand,Snow,Foundation,Road,Lava,Water,Clear
	type = 'Lava'
	;<baseHeight>: central height of extended core matter. Whole number in the range [-16,15], -17 or 16 are invalid
	;the above specified <type> value will replace matter up height <baseHeight>+[random value]*<noiseHeightScale>, so chosing a low
	;<baseHeight> value might be a good idea.
	baseHeight = -16
	;<noiseHeightScale>: vertical noise stretching. Non-negative floating point. 0.0 will create a perfectly flat sphere
	;at height <baseHeight>. 1 will be fairly mountainous, more is usually overkill. 
	noiseHeightScale = 1.0
	;<frequency>: Frequency of noise evolution. The higher, the thinner, sharper and more frequent mountains occur
	;Doesn't affect their height but will create a lot of pointy needles if too high
	;Lower values can be used to relax the terrain
	frequency = 1.0
	;<dampening>: Non-negative whole number. Height levels above and below zero that are collapsed to zero to create an overall flatter terrain
	;E.g. if this is set to 2 then any resulting random height-level ([random value]*<noiseHeightScale>) that is -2,-1,0,1, or 2
	;will be interpreted as 0. Using any non-zero setting will result in flat valleys near the median height (<baseHeight>)
	dampening = 0

;Mountains: Usually dominant appearance of the planet. Under normal circumstances the topmost solid layer.
;Placed ahead of [ExtendedCore], which can subsequently replace sections of it.
[Mountains]
	;<top>: Content of the top-most surface cell (except where intersected by [ExtendedCore], or covered by [Liquid])
	;Depending on height and settings this value may selectively be replaced by 'Snow', or <Liquid.Proximity> where appropriate.
	;If <type> is set to 'Unknown' it can also be replaced by 'Rock', if above height level 2.
	;Valid values are: Granite,Earth,Grass,Rock,Sand,Snow,Foundation,Road,Lava,Water,Clear
	top = 'Grass'
	;<type>: type to fill mountains with.
	;Valid are: Granite,Earth,Grass,Rock,Sand,Snow,Foundation,Road,Lava,Water,Clear, and Unknown.
	;'Unknown' attempts to guess what is best and may also selectively replace <top> under certain circumstances.
	;Using 'Unknown' will chose mostly 'Rock'. 'Earth' is chosen only if appropriate by height, and <top> is set to
	;'Earth', 'Grass', 'Sand', or 'Snow'
	type = 'Unknown'
	;<baseHeight>: Same as <ExtendedCore.baseHeight> except for the mountain layer. Should be set to something
	;much bigger than <ExtendedCore.baseHeight>, since any matter generated by this layer will be replaced by
	;[ExtendedCore]
	baseHeight = 0
	;<noiseHeightScale>: See <ExtendedCore.noiseHeightScale>
	noiseHeightScale = 1.0
	;<frequency>: See <ExtendedCore.frequency>
	frequency = 1.0
	;<dampening>: See <ExtendedCore.dampening>
	dampening = 0
	;<snowHeight>: Height level at which snow will occur. Set to 16+ to disable snow.
	;Snow will replace the top most block in this layer, and selectively override <top>
	snowHeight = 5
	
;Liquid: Final layer, that equally fills up any 'Clear' cells up to the specified water level
;Caves created by [ExtendedCore] configured to <ExtendedCore.type>='Clear' will also be filled
[Liquid]
	;<type>: Type of matter to use as liquid. Can be anything. 'Clear' removes all water
	;Valid choices are: Granite,Earth,Grass,Rock,Sand,Snow,Foundation,Road,Lava,Water,Clear.
	;Common choices are 'Water', 'Snow', 'Sand', 'Lava', or 'Clear'
	type = 'Water'
	;<level>: Water height level in the range [-16,15]
	;It is strongly adviced to not go beyond 13
	level = 0
	;<outline>: Material type spawned surrounding liquid cell blocks. Effective only if <type> is set to 'Water', or 'Lava'.
	;Any matter blocks that are adjacent to liquid blocks and not 'Clear', will be reset to this type.
	;Valid choices are: Granite,Earth,Grass,Rock,Sand,Snow,Foundation,Road,Lava.
	;Usually set to 'Sand' to create beaches.
	;Setting it to 'Water' or 'Clear' will disable this effect
	outline = 'Sand'

	

[Resources]
	[Fuel]
		;density: Average number of fuel units per world cell. Forced similar for each
		;surface chunk
		;Written to savegames and restored from there, but cannot be altered once a
		;game has started.
		;Float32; range=[0,1]; default=0.08.
		density=0.08
		;max:
		;Written to savegames and restored from there, but cannot be altered once a
		;game has started.
		;UInt8; range=[1,32]; default=8.
		max=8
	[Minerals]
		;density: Average number of mineral units per world cell. Forced similar for
		;each surface chunk
		;Written to savegames and restored from there, but cannot be altered once a
		;game has started.
		;Float32; range=[0,1]; default=0.06.
		density=0.06
		;max:
		;Written to savegames and restored from there, but cannot be altered once a
		;game has started.
		;UInt8; range=[1,32]; default=12.
		max=12
	[Energy]
		;density:
		;Written to savegames and restored from there, but cannot be altered once a
		;game has started.
		;Float32; range=[0,1]; default=0.
		density=0
		;max:
		;Written to savegames and restored from there, but cannot be altered once a
		;game has started.
		;UInt8; range=[1,32]; default=1.
		max=1
	[Uranium]
		;density: Average number of uranium units per world cell. Forced similar for
		;each surface chunk
		;Written to savegames and restored from there, but cannot be altered once a
		;game has started.
		;Float32; range=[0,1]; default=0.02.
		density=0.02
		;max:
		;Written to savegames and restored from there, but cannot be altered once a
		;game has started.
		;UInt8; range=[1,32]; default=6.
		max=6	