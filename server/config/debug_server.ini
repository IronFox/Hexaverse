;The following settings are re-imported each time the server is started, and not written to any save-files
[AutoSaves]
	;saveEveryNRounds: number of rounds between auto-saves. not saved to state files
	saveEveryNRounds = 1
	;saveWhenAllQuit: indicates that auto-saves should be performed when the last client disconnects. not saved to state files
	saveWhenAllQuit = true

[AI]
	;nexus: Spawns nexus vehicles, and AI client to control nexus vehicles/structures (if any). this setting is preserved in the save-game. all other settings in this group are re-imported
	nexus = true
	;threatEstimationFactor: linearly affects density of nexus vehicles. if density is saturated, spawning halts
	threatEstimationFactor = 0.5
	;spawnTurrets: list of turrets that the AI will spawn if 'nexus' is set to true.
	;only affects newly created vehicles - does not affect nexus vehicles loaded from a save-file
	spawnTurrets = "Cannon,Artillery,Radar"


;The following are currently not persistent but may migrate into [Game] at some point
[NonPersistentGameSettings]
	;simulateLiquids: Implements some very basic (and very experimental) liquid (water/lava) simulation
	simulateLiquids = true
	;uplinkBandwidth: Maximum faction uplink bandwidth. Structures/vehicles in excess if this bandwidth may enter controlled hibernation, and thus become unavailable
	uplinkBandwidth = 500
	;limitTechniteLife: Technites have a limited time-span
	limitTechniteLife = true

	
;The following settings are persistently written to each save-file, and take effect only when creating a new game
[Game]
	;closed: indicates that new faction can be created only during round 0.
	closed = false
	;roundTimer: time in seconds that players can remain in command phase. once the deadline is reached, rounds will be progressed. set negative or zero to deactivate
	roundTimer = 60
	;extraTechniteRoundTimer: Seconds that technite faction logic has during extra technite rounds. set negative or zero to deactivate
	extraTechniteRoundTimer = 10
	;goal: supported values are "None", "ConquerNexus", and "EMPConquerNexus"
	;  None: No AI bases, no winning rules other than killing everyone else
	;  ConquerNexus: Three AI bases are spawned around the globe. Their center NexusPorts must be conquered by building anything next to it. All three NexusPorts must be conquered to win.
	;  EMPConquerNexus: NexusPorts are spawned on all of the 12 pole points, but only three are expanded to full AI stations. EMP fields are created depending on the number of player factions.
	;    Depending on the number of active factions, two or three of all NexusPorts must be conquered to win the game. It does not matter whether these NexusPorts are surrounded by stations.
	goal="EMPConquerNexus"
	;basesRequired: Indicates that players must maintain minimal bases to be considered 'alive'. Minimal bases include a mandatory compound capable of generating infinite amounts of minerals. Such a compound includes a live mine that can deliver at least 10 units of fuel, one that can deliver at least 5 units of minerals, and a generator. Additionally, the player must own at least one terraformer or a vehicle plant that can be switched on. If any one of these conditions is not met, a death counter will count down each round for the respective faction, until it reaches zero. If it does, all vehicles and structures of that faction are destroyed. If the game is closed and only one faction remains, that faction is declared victor.
	basesRequired = true
	;startBases: New players are given minimal bases (that meet the constraints of basesRequired)
	startBases = true
	;doomsdayWeapons: configures treatment of doomsday-weaponry. Allowed values are: 'Disallow', 'Conceal', and 'Expose'. 'Expose' will notify clients of both the explosion and resulting crater even if they cannot actually see the explosion. 'Conceal' will treat them like ordinary weaponry: if explosion and/or affected terrain are in scanning range, the effects will be partially or completely visible.
	doomsdayWeapons = 'Expose'
	;exposeActionLeftToHostileFactions: sends effective vehicle initiative to hostile factions
	exposeActionLeftToHostileFactions = true
	;newVehiclesHaveFullAmmo: new offensive vehicles using normal ammunition start with full ammo
	newVehiclesHaveFullAmmo = true
	;worldDiscovery: information visible to factions out front: None, Oceans, or FullTerrain
	;Nexus Ports or hostile bases are never shown
	worldDiscovery = 'None'
	;supportedFactions: comma-separated list of supported faction types. 'Regular', 'Technite', and 'Hybrid' are supported in this game-version
	supportedFactions = 'Regular, Technite, Hybrid'
	;extraTechniteRounds: Number of extra rounds that technites have in addition to their regular round. Set to 0 to disable, 1+ means technite factions have additional technite-specific rounds, executed after the computation phases, but before the command-phase.
	extraTechniteRounds = 1
	
	[NexusPorts]
		;haveBases: Nexus bases are constructed around nexus ports
		haveBases = true

	
